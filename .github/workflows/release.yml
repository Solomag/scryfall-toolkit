name: Release

# The release ZIP is built here, from the tag, on a runner everyone can name.
# Building it locally and uploading the file meant the published bytes depended
# on whichever zlib the machine happened to have, and no one could check that
# afterwards. Now the archive comes out of the same run that tests it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the release archive
        run: npm run package

      # package-extension.cjs already reads the archive back and fails if any
      # licence, notice or referenced file is missing, so this only reports the
      # hash of the thing being published.
      - name: Report what is being published
        run: |
          sha256sum dist/*.zip
          unzip -l dist/*.zip | tail -n 5

      # The release notes are the changelog's own section for this tag, so the one document that
      # says "the detail lives in the release notes" is where the detail comes from. A tag with no
      # entry is not an error: the CI note alone is still a release.
      - name: Build the release notes
        run: |
          {
            node tools/release-notes.cjs "${{ github.ref_name }}"
            echo
            echo "---"
            echo
            echo "Built by CI from this tag. The SHA-256 is printed in the workflow run that"
            echo "produced this file, so the bytes published here can be tied to the commit and"
            echo "the runner that made them."
            echo
            echo "Verify against the run: **Actions → Release → ${{ github.ref_name }}**"
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body_path: release-notes.md
