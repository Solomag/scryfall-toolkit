name: Release

# The release ZIP is built here, from the tag, on a runner everyone can name.
# Building it locally and uploading the file meant the published bytes depended
# on whichever zlib the machine happened to have, and no one could check that
# afterwards. Now the archive comes out of the same run that tests it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Store credentials, from the repository's secrets. Each store step runs only when its
    # secrets are set, so a fork, or this repository before they are added, still releases to
    # GitHub and simply skips the stores. See docs/RELEASE_CHECKLIST.md, "Store uploads".
    env:
      CWS_EXTENSION_ID: ofpociogpmmgfjgjnfppnllabhjjnclf
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the release archive
        run: npm run package

      # package-extension.cjs already reads the archive back and fails if any
      # licence, notice or referenced file is missing, so this only reports the
      # hash of the thing being published.
      - name: Report what is being published
        run: |
          sha256sum dist/*.zip
          unzip -l dist/*.zip | tail -n 5

      # The release notes are the changelog's own section for this tag, so the one document that
      # says "the detail lives in the release notes" is where the detail comes from. A tag with no
      # entry is not an error: the CI note alone is still a release.
      - name: Build the release notes
        run: |
          {
            node tools/release-notes.cjs "${{ github.ref_name }}"
            echo
            echo "---"
            echo
            echo "Built by CI from this tag. The SHA-256 is printed in the workflow run that"
            echo "produced this file, so the bytes published here can be tied to the commit and"
            echo "the runner that made them."
            echo
            echo "Verify against the run: **Actions → Release → ${{ github.ref_name }}**"
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body_path: release-notes.md

      # The same archive the release carries goes to the Chrome Web Store and is submitted for
      # review there. Publishing waits on Google's review; nothing here can skip it.
      - name: Upload to the Chrome Web Store
        if: env.CWS_CLIENT_ID != '' && env.CWS_CLIENT_SECRET != '' && env.CWS_REFRESH_TOKEN != ''
        run: |
          npx --yes chrome-webstore-upload-cli@3.3.1             --source "dist/scryfall-toolkit-${GITHUB_REF_NAME#v}.zip"             --extension-id "$CWS_EXTENSION_ID"             --client-id "$CWS_CLIENT_ID"             --client-secret "$CWS_CLIENT_SECRET"             --refresh-token "$CWS_REFRESH_TOKEN"

      # web-ext signs a folder, not an archive, so the Firefox archive is unpacked first — the
      # bytes submitted are the ones in the release. Listed channel: the version goes to AMO's
      # review and appears on the listing once it passes. The step does not wait for that.
      - name: Submit to addons.mozilla.org
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: |
          mkdir -p amo-src
          unzip -q "dist/scryfall-toolkit-${GITHUB_REF_NAME#v}-firefox.zip" -d amo-src
          npx --yes web-ext@8.3.0 sign             --source-dir amo-src             --artifacts-dir amo-artifacts             --channel listed             --approval-timeout 0             --api-key "$AMO_JWT_ISSUER"             --api-secret "$AMO_JWT_SECRET"
